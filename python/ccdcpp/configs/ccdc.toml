# ccdc: pyccd's CCDC algorithm (Zhu & Woodcock 2014, as pyccd implements it), with the
# corrections listed in the README. Values are in physical units: reflectance 0-1, degrees
# Celsius, days, observations. A run converts them to its data spec's units once.
#
# A file of your own starts from this one and lists only what it changes:
#     extends = "ccdc"
#     [refit]
#     factor = 2.0

# --- Values several stages share ----------------------------------------------------------

[shared]
detection_bands = ["green", "red", "nir", "swir1", "swir2"]  # the bands a change is tested on
change_probability = 0.99        # the change tests' threshold is its chi-squared quantile
outlier_probability = 0.999999   # the outlier tests' threshold is its chi-squared quantile
min_observations = 12            # the fewest observations a curve is fitted on
statistics_end = "none"          # the last date the statistics read; "none": the whole series

[shared.coefficients]            # how many harmonic coefficients a curve gets
min = 4                          # coefficients below mid x per observations
mid = 6                          # coefficients below max x per observations
max = 8                          # coefficients otherwise: the basis width
per = 3                          # observations per coefficient

[shared.lasso]                   # the Lasso every fitting stage uses
alpha = 0.0001                   # the L1 penalty, in reflectance
coef_floor = 0.0001              # the least coefficient the tolerance scales, in reflectance
max_iter = 1000                  # coordinate descent sweeps at most
tolerance = 0.0001               # a sweep's relative update at which it checks the duality gap

# --- Preprocessing: which observations each procedure keeps -------------------------------

[preprocess.standard]
thermal = "celsius"              # through the spec's thermal transform (degrees Celsius)
steps = [
    { step = "keep_qa", codes = ["clear", "water"] },
    { step = "thermal_range", celsius = [-93.2, 70.7] },                                                           # degrees Celsius
    { step = "band_range", bands = ["blue", "green", "red", "nir", "swir1", "swir2"], reflectance = [0.0, 1.0] },  # reflectance
    { step = "one_per_date" },
]

[preprocess.insufficient_clear]
thermal = "stored"               # as stored; the range still compares in degrees Celsius
steps = [
    { step = "keep_qa", codes = ["clear", "water"] },
    { step = "thermal_range", celsius = [-93.2, 70.7] },                                                           # degrees Celsius
    { step = "band_range", bands = ["blue", "green", "red", "nir", "swir1", "swir2"], reflectance = [0.0, 1.0] },  # reflectance
    { step = "one_per_date" },
    { step = "green_median", offset = 0.04, scope = "stat_window" },                                               # reflectance
    { step = "one_per_date" },
]

[preprocess.snow]
thermal = "stored"               # as stored; the range still compares in degrees Celsius
steps = [
    { step = "keep_qa", codes = ["clear", "water"] },
    { step = "thermal_range", celsius = [-93.2, 70.7] },                                                           # degrees Celsius
    { step = "band_range", bands = ["blue", "green", "red", "nir", "swir1", "swir2"], reflectance = [0.0, 1.0] },  # reflectance
    { step = "one_per_date" },
    { step = "add_qa", codes = ["snow"] },
    { step = "one_per_date" },
    { step = "thermal_range", celsius = [-93.2, 70.7] },                                                           # degrees Celsius
]

# --- The stages, in the order a pixel meets them ------------------------------------------

[mode]                           # the procedure a pixel runs: standard, snow or insufficient clear
strategy = "pyccd"
clear_pct_threshold = 0.25
snow_pct_threshold = 0.75

[noise]                          # each band's noise, which every test scales by
strategy = "variogram"
min_lag_days = 30                # days

[start_search]                   # where a curve may start: the first window of enough time
strategy = "pyccd"
day_delta = 365                  # days

[window_screen]                  # the outliers dropped from a start window before it is fitted
strategy = "tmask"
bands = ["green", "swir1"]
t_const = 4.89

[stability_fit]                  # the fit a start window is judged on
strategy = "lasso"

[stability_rule]                 # whether that fit is stable enough to start a curve
strategy = "pyccd"
peek = "change_test"             # observations, or "change_test"

[lookback]                       # the observations before the start that join the curve
strategy = "pyccd"
peek = "change_test"             # observations, or "change_test"

[model]                          # the curve fitted while a segment grows
strategy = "lasso"

[change_test]                    # whether the next peek of observations breaks the curve
strategy = "chi2"
peek_size = 6                    # observations
peek_reference_days = 16.0       # days
model_rmse_up_to = 24            # observations
seasonal_count = 24              # observations
seasonal_divisor = 4.0

[outlier]                        # a single observation that does not fit, dropped
strategy = "floored"
statistic = "change_magnitude"

[refit]                          # when a growing curve is refitted
strategy = "span-factor"
min_obs = 24                     # observations
factor = 1.33

[segment_report]                 # the fit a finished segment reports
strategy = "model-fit"

[edge_segments]                  # the Start and End segments, and the snow and insufficient-clear procedures' whole-series curve
strategy = "lasso"
