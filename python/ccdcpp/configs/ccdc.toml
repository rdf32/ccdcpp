# The ccdc preset: pyccd's algorithm, as ccdcpp corrects it (README), in physical terms: the
# shared alpha and coef_floor and the preprocessing's reflectance bounds and offset in
# reflectance (a run multiplies them by its input's reflectance_scale), the thermal bounds in
# degrees Celsius, probabilities for the chi-squared thresholds, bands by role, QA codes by
# name, no statistics cutoff (statistics_end 9223372036854775807). The library registry's "ccdc"
# preset (ccd::strategies::library_registry().preset("ccdc")), written out by its Config's
# to_toml().

[shared]
change_probability = 0.99
detection_bands = ["green", "red", "nir", "swir1", "swir2"]
min_observations = 12
outlier_probability = 0.999999
statistics_end = 9223372036854775807

[shared.coefficients]
max = 8
mid = 6
min = 4
per = 3

[shared.lasso]
alpha = 0.0001
coef_floor = 0.0001
max_iter = 1000
tolerance = 0.0001

[change_test]
strategy = "chi2"
[change_test.params]
model_rmse_up_to = 24
peek_reference_days = 16.0
peek_size = 6
seasonal_count = 24
seasonal_divisor = 4.0

[edge_segments]
strategy = "lasso"

[lookback]
strategy = "pyccd"
[lookback.params]
peek = 0

[mode]
strategy = "pyccd"
[mode.params]
clear_pct_threshold = 0.25
snow_pct_threshold = 0.75

[model]
strategy = "lasso"

[noise]
strategy = "variogram"
[noise.params]
min_lag_days = 30

[outlier]
strategy = "floored"
[outlier.params]
statistic = "change_magnitude"

[refit]
strategy = "span-factor"
[refit.params]
factor = 1.33
min_obs = 24

[segment_report]
strategy = "model-fit"

[stability_fit]
strategy = "lasso"

[stability_rule]
strategy = "pyccd"
[stability_rule.params]
peek = 0

[start_search]
strategy = "pyccd"
[start_search.params]
day_delta = 365

[window_screen]
strategy = "tmask"
[window_screen.params]
bands = ["green", "swir1"]
t_const = 4.89

[preprocess.standard]
thermal_transform = true
steps = [
    { step = "keep_qa", codes = ["clear", "water"] },
    { step = "thermal_range", max = 70.7, max_inclusive = false, min = -93.2, min_inclusive = false },
    { step = "band_range", bands = "reflective", max = 1.0, max_inclusive = false, min = 0.0, min_inclusive = false },
    { step = "one_per_date" },
]

[preprocess.snow]
thermal_transform = false
steps = [
    { step = "keep_qa", codes = ["clear", "water"] },
    { step = "thermal_range", max = 70.7, max_inclusive = false, min = -93.2, min_inclusive = false },
    { step = "band_range", bands = "reflective", max = 1.0, max_inclusive = false, min = 0.0, min_inclusive = false },
    { step = "one_per_date" },
    { step = "add_qa", codes = ["snow"] },
    { step = "one_per_date" },
    { step = "thermal_range", max = 70.7, max_inclusive = false, min = -93.2, min_inclusive = false },
]

[preprocess.insufficient_clear]
thermal_transform = false
steps = [
    { step = "keep_qa", codes = ["clear", "water"] },
    { step = "thermal_range", max = 70.7, max_inclusive = false, min = -93.2, min_inclusive = false },
    { step = "band_range", bands = "reflective", max = 1.0, max_inclusive = false, min = 0.0, min_inclusive = false },
    { step = "one_per_date" },
    { step = "green_median", offset = 0.04, scope = "stat_window" },
    { step = "one_per_date" },
]
