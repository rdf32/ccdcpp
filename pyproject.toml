[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"

[project]
name = "ccdcpp"
version = "0.1.2"
description = "High-performance C++/Python implementation of Continuous Change Detection algorithm for Landsat."
readme = "README.md"
# 3.11, not 3.12. The extension is pybind11 over C++17 and uses no 3.12 API;
# the previous floor described the machine it was developed on rather than a
# requirement, and it locked the package out of environments that have the
# geospatial stack (zarr, pyarrow) pinned to 3.11.
requires-python = ">=3.11"

[tool.scikit-build]
cmake.args = [
    "-DCCD_BUILD_PYTHON=ON",
    "-DCCD_BUILD_TESTS=OFF",
    "-DCCD_INSTALL_CPP=OFF",
    "-DCMAKE_BUILD_TYPE=Release"
]
[tool.scikit-build.wheel]
packages = ["python/ccdcpp"]